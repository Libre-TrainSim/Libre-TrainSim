name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets maintainers run the pipeline manually (e.g. after approving workflows on a fork PR).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-test
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.4'
  GODOT_RELEASE_TAG: '4.4-stable'
  # Filenames from https://github.com/godotengine/godot/releases/tag/4.4-stable
  GODOT_LINUX_ZIP: Godot_v4.4-stable_linux.x86_64.zip
  GODOT_LINUX_BIN: Godot_v4.4-stable_linux.x86_64
  EXPORT_NAME: Libre_TrainSim

jobs:
  # Import assets, then parse every .gd file via GDScript.reload() (Godot 4.x).
  validate-project:
    name: Validate GDScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Godot editor (Linux)
        run: curl -fSL -o "../${{ env.GODOT_LINUX_ZIP }}" "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/${{ env.GODOT_LINUX_ZIP }}"

      - name: Extract Godot
        run: unzip -d .. "../${{ env.GODOT_LINUX_ZIP }}" && chmod +x "../${{ env.GODOT_LINUX_BIN }}"

      - name: Import project resources
        run: ../${{ env.GODOT_LINUX_BIN }} --headless --path src --import

      - name: Parse all GDScript files
        run: ../${{ env.GODOT_LINUX_BIN }} --headless --path src -s res://tools/ci_validate_scripts.gd

  export-windows:
    if: false # Disabled because @HaSa can't wrap his head around Godot not wanting to properly start and terminate.
    name: Windows Exports
    runs-on: windows-latest
    env:
      GODOT_WIN_ZIP: Godot_v4.4-stable_win64.exe.zip
      GODOT_WIN_EXE: Godot_v4.4-stable_win64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load Import Folder
        uses: actions/cache/restore@v4
        with:
          path: src/.godot
          enableCrossOsArchive: true
          key: GodotImport-Windows-${{ hashFiles('src/.godot/**') }}
          restore-keys: |
            GodotImport-Windows-
            GodotImport-

      - name: Download Godot
        run: Invoke-WebRequest -o "../${{ env.GODOT_WIN_ZIP }}" "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/${{ env.GODOT_WIN_ZIP }}"

      - name: Extract Godot
        run: 7z e "../${{ env.GODOT_WIN_ZIP }}" -o".."

      - name: Create export template directory
        run: mkdir "$env:appdata/godot/export_templates/${{ env.GODOT_VERSION }}.stable"

      - name: Get export templates from cache
        id: export-templates-cache
        uses: actions/cache@v4
        with:
          path: ../Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          key: Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz

      - name: Download export templates
        if: steps.export-templates-cache.outputs.cache-hit != 'true'
        run: Invoke-WebRequest -o "../Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz" "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"

      - name: Install export templates
        run: |
          7z e "../Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz" -o"$env:appdata/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          dir "$env:appdata/godot/export_templates/${{ env.GODOT_VERSION }}.stable"

      - name: Create build folders
        run: |
          mkdir build/windows
          mkdir build/windows-debug

      - name: Import project resources
        run: Start-Process "../${{ env.GODOT_WIN_EXE }}" -ArgumentList 'src/project.godot --headless --import' -Wait -NoNewWindow -PassThru

      - name: Export Windows Release
        shell: bash
        run: ../${{ env.GODOT_WIN_EXE }} --headless --path src --export-release "Windows Desktop" ../build/windows/${{ env.EXPORT_NAME }}.exe

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows

      - name: Export Windows Debug
        run: Start-Process "../${{ env.GODOT_WIN_EXE }}" -ArgumentList '--headless --path src --export-debug "Windows Desktop" ../build/windows-debug/${{ env.EXPORT_NAME }}_debug.exe' -Wait -NoNewWindow -PassThru

      - name: Upload Windows Debug
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug
          path: build/windows-debug

      - name: Store import cache
        uses: actions/cache/save@v4
        with:
          path: src/.godot
          enableCrossOsArchive: true
          key: GodotImport-Windows-${{ hashFiles('src/.godot/**') }}

  export-linux:
    name: Linux Exports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load import cache
        uses: actions/cache/restore@v4
        with:
          path: src/.godot
          enableCrossOsArchive: true
          key: GodotImport-Linux-${{ hashFiles('src/.godot/**') }}
          restore-keys: |
            GodotImport-Linux-
            GodotImport-

      - name: Download Godot editor
        run: curl -fSL -o "../${{ env.GODOT_LINUX_ZIP }}" "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/${{ env.GODOT_LINUX_ZIP }}"

      - name: Extract Godot
        run: unzip -d .. "../${{ env.GODOT_LINUX_ZIP }}" && chmod +x "../${{ env.GODOT_LINUX_BIN }}" && ls -la ..

      - name: Create export template directory
        run: mkdir -v -p "${HOME}/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"

      - name: Download export templates
        run: curl -fSL -o "../Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz" "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"

      - name: Install export templates
        run: |
          unzip -j -d "${HOME}/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable" "../Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"
          ls -la "${HOME}/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"

      - name: Create build folders
        run: |
          mkdir -v -p build/linux
          mkdir -v -p build/linux-debug

      - name: Import project resources
        run: ../${{ env.GODOT_LINUX_BIN }} --headless --path src --import

      - name: Export Linux Release
        run: ../${{ env.GODOT_LINUX_BIN }} --headless --path src --export-release "Linux64" ../build/linux/${{ env.EXPORT_NAME }}.x86_64

      - name: Upload Linux Release
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux

      - name: Export Linux Debug
        run: ../${{ env.GODOT_LINUX_BIN }} --headless --path src --export-debug "Linux64" ../build/linux-debug/${{ env.EXPORT_NAME }}_debug.x86_64

      - name: Upload Linux Debug
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug
          path: build/linux-debug

      - name: Store import cache
        uses: actions/cache/save@v4
        with:
          path: src/.godot
          enableCrossOsArchive: true
          key: GodotImport-Linux-${{ hashFiles('src/.godot/**') }}

  export-mac:
    name: Mac and Windows Exports
    runs-on: macos-latest
    env:
      GODOT_MAC_ZIP: Godot_v4.4-stable_macos.universal.zip
      GODOT_WIN_ZIP: Godot_v4.4-stable_win64.exe.zip
      GODOT_WIN_EXE: Godot_v4.4-stable_win64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load import cache
        uses: actions/cache/restore@v4
        with:
          path: src/.godot
          enableCrossOsArchive: true
          key: GodotImport-Mac-${{ hashFiles('src/.godot/**') }}
          restore-keys: |
            GodotImport-Mac-
            GodotImport-

      - name: Download Godot (macOS)
        run: curl -fSL -o "../${{ env.GODOT_MAC_ZIP }}" "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/${{ env.GODOT_MAC_ZIP }}"

      - name: Extract Godot (macOS)
        run: unzip -d .. "../${{ env.GODOT_MAC_ZIP }}"

      - name: Download Godot (Windows, for cross-export)
        run: curl -fSL -o "../${{ env.GODOT_WIN_ZIP }}" "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/${{ env.GODOT_WIN_ZIP }}"

      - name: Extract Godot (Windows)
        run: unzip -d .. "../${{ env.GODOT_WIN_ZIP }}" && chmod +x "../${{ env.GODOT_WIN_EXE }}"

      - name: Create export template directory
        run: mkdir -v -p "${HOME}/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable"

      - name: Get export templates from cache
        id: export-templates-cache
        uses: actions/cache@v4
        with:
          path: ../Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          key: Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz

      - name: Download export templates
        if: steps.export-templates-cache.outputs.cache-hit != 'true'
        run: curl -fSL -o "../Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz" "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"

      - name: Install export templates
        run: |
          unzip -j -d "${HOME}/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable" "../Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"
          ls -la "${HOME}/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable"

      - name: Create build folders
        run: |
          mkdir -v -p build/mac
          mkdir -v -p build/mac-debug
          mkdir -v -p build/windows
          mkdir -v -p build/windows-debug

      - name: Import project resources
        run: ../Godot.app/Contents/MacOS/Godot --headless --path src --import

      - name: Export macOS Release
        run: ../Godot.app/Contents/MacOS/Godot --headless --path src --export-release "Mac OSX" ../build/mac/${{ env.EXPORT_NAME }}.zip

      - name: Upload macOS Release
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/mac

      - name: Export macOS Debug
        run: ../Godot.app/Contents/MacOS/Godot --headless --path src --export-debug "Mac OSX" ../build/mac-debug/${{ env.EXPORT_NAME }}_debug.zip

      - name: Upload macOS Debug
        uses: actions/upload-artifact@v4
        with:
          name: mac-debug
          path: build/mac-debug

      - name: Export Windows Release
        run: ../${{ env.GODOT_WIN_EXE }} --headless --path src --export-release "Windows Desktop" ../build/windows/${{ env.EXPORT_NAME }}.exe

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows

      - name: Export Windows Debug
        run: ../${{ env.GODOT_WIN_EXE }} --headless --path src --export-debug "Windows Desktop" ../build/windows-debug/${{ env.EXPORT_NAME }}_debug.exe

      - name: Upload Windows Debug
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug
          path: build/windows-debug

      - name: Store import cache
        uses: actions/cache/save@v4
        with:
          path: src/.godot
          enableCrossOsArchive: true
          key: GodotImport-Mac-${{ hashFiles('src/.godot/**') }}

